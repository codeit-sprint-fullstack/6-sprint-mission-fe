<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓</title>
    
    <!-- SEO 작업 -->
    <meta name="description" content="판다마켓은 당신의 지역 커뮤니티와 연결되어 중고 거래를 쉽게 할 수 있는 온라인 마켓입니다. 지역 기반으로 상품을 사고팔고, 실시간으로 거래하세요." />
    <meta name="author" content="HongSungHoon" />
    <meta name="keywords" content="판다마켓, 중고 거래, 지역 마켓, 당근마켓, 중고 물품, 거래, 지역 소식" />
    <meta name="robots" content="index, follow" />
    <link rel="shortcut icon" href="/images/logo/favicon.ico" type="image/x-icon">

    <!-- OG (Open Graph Data) -->
    <meta property="og:site_name" content="판다마켓">
    <meta property="og:type" content="website">
    <meta property="og:url" content="(배포후 URL)">
    <meta property="og:title" content="판다마켓 - 지역 기반 중고 거래">
    <meta property="og:image" content="https://www.pandamarket.com/images/logo/panda-logo.png">
    <meta property="og:description" content="판다마켓은 지역 사회의 중고 물품을 거래할 수 있는 온라인 플랫폼입니다. 당근마켓처럼 쉽게 지역 사람들과 소통하고 거래하세요.">
    
    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/14dfbf5c1d.js" crossorigin="anonymous"></script>
    
    <!-- Jquery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>

    <!-- https://kenwheeler.github.io/slick/ -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>

    <!-- css + js -->
    <link rel="stylesheet" href="/styles/reset.css">
    <link rel="stylesheet" href="styles/index.css">
    <script src="/scripts/common.js" defer></script>
</head>
<body>
    <div id="header" style="position: sticky; left : 0; top : 0; z-index: 100"></div>
    <main>
        <section class="intro_section">
            <div class="intro_content">
                <h1 class="intro_title">일상의 모든 물건을<br>거래해 보세요</h1>
                <a href="/pages/item.html" class="view_items_link">구경하러 가기</a>
            </div>
        </section>
        <section class="feature_section">   
            <div class="feature_items">
                <div class="feature_item">
                    <img src="/images/home/feature1-image.png" alt="인기 상품 이미지" class="feature_image">
                    <div class="feature_description">
                        <h2 class="feature_subtitle">Hot item</h2>
                        <h1 class="feature_title">인기 상품을<br>확인해 보세요</h1>
                        <p class="feature_text">가장 HOT한 중고거래 물품을<br>판다마켓에서 확인해 보세요</p>
                    </div>
                </div>
                <div class="feature_item search">
                    <img src="/images/home/feature2-image.png" alt="상품 검색 이미지" class="feature_image">
                    <div class="feature_description">
                        <h2 class="feature_subtitle">Search</h2>
                        <h1 class="feature_title">구매를 원하는<br>상품을 검색하세요</h1>
                        <p class="feature_text">구매하고 싶은 물품은 검색해서<br>쉽게 찾아보세요</p>
                    </div>
                </div>
                <div class="feature_item">
                    <img src="/images/home/feature3-image.png" alt="상품 등록 이미지" class="feature_image">
                    <div class="feature_description">
                        <h2 class="feature_subtitle">Register</h2>
                        <h1 class="feature_title">판매를 원하는<br>상품을 등록하세요</h1>
                        <p class="feature_text">어떤 물건이든 판매하고 싶은 상품을<br>쉽게 등록하세요</p>
                    </div>
                </div>
            </div>
        </section>
        <section class="trust_section">
            <div class="trust_content">
                <h1 class="trust_title">믿을 수 있는<br>판다마켓 중고거래</h1>
            </div>
        </section>
    </main>
    <div id="footer"></div>

    <script>
        fetch('/pages/header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header').innerHTML = data;

                // ★ 여기서 getCookie와 로그인 상태 확인 실행 ★
                function getCookie(name) {
                    const cookies = document.cookie.split('; ');
                    for (let cookie of cookies) {
                        const [key, value] = cookie.split('=');
                        if (key === name) {
                            return decodeURIComponent(value);
                        }
                    }
                    return null;
                }

                function deleteCookie(name) {
                    document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
                }

                // 로그인 상태 확인
                const username = getCookie('username');
                const token = getCookie('token');

                if (username && token) {
                    // 로그인 TRUE
                    document.querySelector('.login_link').textContent = "로그아웃";
                    // 로그아웃 버튼 클릭 시 쿠키 삭제
                    document.querySelector('.login_link').addEventListener('click', (e) => {
                        e.preventDefault();
                        if (document.querySelector('.login_link').textContent === '로그아웃') {
                            deleteCookie('username'); // username 쿠키 삭제
                            deleteCookie('token');    // token 쿠키 삭제 (로그인 상태 확인용)
                            location.href = '/index.html'; // 로그아웃 후 메인 페이지로 이동
                            return;
                        } else {
                            location.href = './pages/login.html'
                        }
                    });
                } else {
                    document.querySelector('.login_link').textContent = "로그인";
                }
            })
            .catch(error => console.error('Error loading header:', error));

        fetch('/pages/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer').innerHTML = data;
            })
            .catch(error => console.error('Error loading footer:', error));
    </script>
</body>
</html>
